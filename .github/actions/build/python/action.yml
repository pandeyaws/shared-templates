name: Python Build Action
description: Build and push a Python application Docker image to a container registry 
inputs:
  python-version:
    description: Python version to use for the build
    required: false
    default: "3.12"
  enable-tests:
    description: Whether to run tests before building the image
    required: false
    default: "false"  
  docker_username:
    description: Docker username for the container registry
    required: true
  docker_password:
    description: Docker password for the container registry
    required: true
  acr_name:
    description: Azure Container Registry name
    required: true
  acr_login_server:
    description: Azure Container Registry login server
    required: true
  image_name:
    description: Name of the Docker image to build and push
    required: true
  image_tag:
    description: Tag for the Docker image to build and push
    required: true
  scan_image:
    description: Whether to scan the Docker image for vulnerabilities
    required: false
    default: "true"  
runs:
  using: "composite"
  steps:
    - name: Check out source
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install test dependencies
      shell: pwsh
      run: python -m pip install -r requirements.txt "httpx2>=2.0.0,<3.0.0" "pytest>=8.0.0,<10.0.0" "pytest-cov>=5.0.0,<8.0.0"

    - name: Run tests
      if: ${{ inputs.enable-tests == 'true' }}
      shell: pwsh
      run: python -m pytest --junitxml=test-results.xml --cov=app --cov-fail-under=80 --cov-report=xml:coverage.xml --cov-report=term-missing

    - name: Upload test artifacts
      if: ${{ inputs.enable-tests == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: python-test-artifacts
        path: |
          test-results.xml
          coverage.xml
          tests/test_main.py
        if-no-files-found: error
        retention-days: 14

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: false  

    - name: Verify ACR configuration   
      shell: pwsh
      run: |
        test -n ${{ inputs.acr_name}} || { echo "${{ inputs.acr_name}} is not configured"; exit 1; }
        test -n ${{ inputs.acr_login_server}} || { echo "${{ inputs.acr_login_server}} is not configured"; exit 1; }

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Sign in to Azure with OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.AZURE_CLIENT_ID }}
        tenant-id: ${{ inputs.AZURE_TENANT_ID }}
        subscription-id: ${{ inputs.AZURE_SUBSCRIPTION_ID }}

    - name: Sign in to ACR
      shell: pwsh
      run: az acr login --name ${{ inputs.acr_name}}

    - name: Generate image tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.acr_login_server }}/${{ inputs.image_name}}
        tags: |
          type=raw,value=${{ inputs.image_tag }}
          type=raw,value=${{ github.sha }}

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Scan image for vulnerabilities
      if: ${{ inputs.scan_image == 'true' }}
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ inputs.acr_login_server }}/${{ inputs.image_name}}:${{ inputs.image_tag }}
        format: table
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: os,library
        severity: CRITICAL,HIGH
    