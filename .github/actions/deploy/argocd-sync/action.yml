name: argocd sync

description: Sync ArgoCD applications using configurable server and app names.

inputs:
  app_id:
    description: GitHub App ID used to create the installation token
    required: true
  private_key:
    description: Private key for the GitHub App
    required: true
  target_revision:
    description: Target revision or image tag to set in the ApplicationSet
    required: true
  repo_owner:
    description: GitHub repository owner for the ArgoCD config repo
    required: false
    default: pandeyaws
  repo_name:
    description: GitHub repository name for the ArgoCD config repo
    required: false
    default: sample-python-app-argocd
  branch:
    description: Branch to update in the ArgoCD config repo
    required: false
    default: master
  appset_path:
    description: Path to the ApplicationSet manifest in the ArgoCD config repo
    required: false
    default: argocd/sample-python-app-appset.yaml
  environment_name:
    description: ApplicationSet environment whose targetRevision should be updated
    required: false
    default: dev
  argocd_server:
    description: ArgoCD server host and port, for example 57.151.50.28:80
    required: true
  argocd_username:
    description: ArgoCD username for login
    required: true
    default: admin
  argocd_password:
    description: ArgoCD password for login
    required: true
  parent_app:
    description: Parent app name to sync and wait on
    required: true
    default: apps-sample-python-app
  child_app:
    description: Child app name to wait on
    required: true
    default: sample-python-app-dev
  cert_manager_app:
    description: Cert-manager app name to wait on
    required: true
    default: cert-manager
  external-secrets:
    description: External-dns app name to wait on
    required: true
    default: external-secrets    

  

runs:
  using: composite
  steps:
    - name: update argocd ApplicationSet manifest in an external repo
      uses: pandeyaws/shared-templates/.github/actions/deploy/update-argocd-yaml-file@master
      with:
        app_id: ${{ inputs.app_id }}
        private_key: ${{ inputs.private_key }}
        target_revision: ${{ inputs.target_revision }}
        repo_owner: ${{ inputs.repo_owner }}
        repo_name: ${{ inputs.repo_name }}
        branch: ${{ inputs.branch }}
        appset_path: ${{ inputs.appset_path }}
        environment_name: ${{ inputs.environment_name }}

    - name: Install ArgoCD CLI
      shell: bash
      run: |
        curl --fail --show-error --location --retry 3 \
          --output /tmp/argocd \
          https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
        sudo install -m 555 /tmp/argocd /usr/local/bin/argocd
        argocd version --client

    - name: Login to ArgoCD
      shell: bash
      env:
        ARGOCD_SERVER: ${{ inputs.argocd_server }}
        ARGOCD_USERNAME: ${{ inputs.argocd_username }}
        ARGOCD_PASSWORD: ${{ inputs.argocd_password }}
      run: |
        argocd login "$ARGOCD_SERVER" \
          --username "$ARGOCD_USERNAME" \
          --password "$ARGOCD_PASSWORD" \
          --insecure \
          --grpc-web

    - name: Sync Parent App
      shell: bash
      env:
        PARENT_APP: ${{ inputs.parent_app }}
      run: |
        argocd app sync "$PARENT_APP"
        argocd app wait "$PARENT_APP" --health --sync

    - name: Sync Child Apps
      shell: bash
      env:
        CHILD_APP: ${{ inputs.child_app }}
      run: |
        argocd app wait "$CHILD_APP" --sync --health --timeout 600
        argocd app sync ${{ inputs.cert_manager_app }}
        argocd app sync ${{ inputs.external-secrets }}
        