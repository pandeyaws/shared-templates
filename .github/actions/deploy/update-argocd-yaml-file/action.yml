name: Update ArgoCD ApplicationSet

description: Update the targetRevision field in an ApplicationSet manifest in an external repo using a GitHub App token.

inputs:
  app_id:
    description: GitHub App ID used to create the installation token
    required: true
  private_key:
    description: Private key for the GitHub App
    required: true
  target_revision:
    description: Target revision or image tag to set in the ApplicationSet
    required: true
  repo_owner:
    description: GitHub repository owner for the ArgoCD config repo
    required: true
    default: pandeyaws
  repo_name:
    description: GitHub repository name for the ArgoCD config repo
    required: true
    default: sample-python-app-argocd
  branch:
    description: Branch to checkout in the external repo
    required: false
    default: master
  appset_path:
    description: Path to the ApplicationSet manifest to update in the external repo
    required: false
    default: argocd/sample-python-app-appset.yaml
  environment_name:
    description: ApplicationSet environment whose targetRevision should be updated
    required: false
    default: dev

runs:
  using: composite
  steps:
    - name: Generate GitHub App token
      id: argocd_token
      uses: actions/create-github-app-token@v1
      with:
        app_id: ${{ inputs.app_id }}
        private_key: ${{ inputs.private_key }}
        owner: ${{ inputs.repo_owner }}
        repositories: ${{ inputs.repo_name }}
        permission-contents: write

    - name: Check out Argo CD configuration
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repo_owner }}/${{ inputs.repo_name }}
        ref: ${{ inputs.branch }}
        path: argocd-config
        token: ${{ steps.argocd_token.outputs.token }}
        fetch-depth: 0

    - name: Update ApplicationSet target revision
      shell: bash
      env:
        TARGET_REVISION: ${{ inputs.target_revision }}
        APPSET_PATH: ${{ inputs.appset_path }}
        ENVIRONMENT_NAME: ${{ inputs.environment_name }}
      run: |
        python - <<'PY'
        import os
        import re
        from pathlib import Path

        target_revision = os.environ["TARGET_REVISION"]
        if not target_revision or "\n" in target_revision or "\r" in target_revision:
            raise SystemExit("Target revision must be a non-empty single-line value")
        environment_name = re.escape(os.environ["ENVIRONMENT_NAME"])
        appset = Path("argocd-config") / os.environ["APPSET_PATH"]
        text = appset.read_text(encoding="utf-8")
        pattern = re.compile(
            rf"(?m)^([ \t]*-[ \t]*environment:[ \t]*{environment_name}[ \t]*\r?\n"
            r"[ \t]*targetRevision:[ \t]*)([^\r\n]*)"
        )
        updated, count = pattern.subn(
            lambda match: f"{match.group(1)}{target_revision}", text
        )
        if count != 1:
            raise SystemExit(
                f"Expected exactly one {os.environ['ENVIRONMENT_NAME']} environment targetRevision in {appset}, found {count}"
            )
        appset.write_text(updated, encoding="utf-8")
        PY

    - name: Commit and push ApplicationSet update
      shell: bash
      env:
        TARGET_REVISION: ${{ inputs.target_revision }}
        APPSET_PATH: ${{ inputs.appset_path }}
        REPO_NAME: ${{ inputs.repo_name }}
        BRANCH: ${{ inputs.branch }}
      run: |
        git -C argocd-config config user.name "github-actions[bot]"
        git -C argocd-config config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git -C argocd-config add "$APPSET_PATH"
        if git -C argocd-config diff --cached --quiet; then
          echo "ApplicationSet already targets ${TARGET_REVISION}; no commit needed."
          exit 0
        fi
        git -C argocd-config commit -m "chore: deploy ${REPO_NAME} ${TARGET_REVISION}"
        git -C argocd-config push origin "HEAD:${BRANCH}"