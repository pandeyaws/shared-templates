name: Tag Actions

on:
  push:
    branches:
      - master
    paths:
      - '.github/actions/**/action.yml'  

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate Version
        id: version
        run: |
          git fetch --tags

          latest_tag=$(git tag -l 'v*.*.*' --sort=-version:refname | head -n1)

          if [ -z "$latest_tag" ]; then
            next_tag="v1.0.0"
          else
            major=$(echo "$latest_tag" | cut -d. -f1 | tr -d v)
            minor=$(echo "$latest_tag" | cut -d. -f2)
            patch=$(echo "$latest_tag" | cut -d. -f3)

            patch=$((patch + 1))
            next_tag="v${major}.${minor}.${patch}"
          fi

          echo "tag=$next_tag" >> $GITHUB_OUTPUT

      - name: Create Temporary Release Branch
        run: |
          RELEASE_BRANCH="release-${{ steps.version.outputs.tag }}"

          git checkout -b "$RELEASE_BRANCH"

      - name: Update References
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          echo "Updating references to ${TAG}"

          find . -type f \( \
            -name "*.yml" -o \
            -name "*.yaml" -o \
            -name "README.md" -o \
            -name "action.yml" \
          \) | while read file
          do
            sed -i -E \
              "s|(pandeyaws/[^@[:space:]]+)@v[0-9]+\.[0-9]+\.[0-9]+|\1@${TAG}|g" \
              "$file"
          done

      - name: Commit Release Content
        run: |
          git add .

          if git diff --cached --quiet; then
            echo "No references changed"
          else
            git commit -m "Release ${{ steps.version.outputs.tag }}"
          fi

      - name: Create Tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          git tag "$TAG"

          MAJOR_TAG="${TAG%%.*}"

          git tag -f "$MAJOR_TAG"

          git push origin "$TAG"
          git push origin -f "$MAJOR_TAG"

      - name: Cleanup
        run: |
          git checkout master
          git branch -D "release-${{ steps.version.outputs.tag }}"