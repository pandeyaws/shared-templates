name: Tag actions

on:
  push:
    branches:
      - master
    paths:
      - ".github/actions/**/action.yml"
      - ".github/actions/**/action.yaml"

permissions:
  contents: write

concurrency:
  group: tag-actions
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Generate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import subprocess

          versions = []
          for tag in subprocess.check_output(
              ["git", "tag", "--list"], text=True
          ).splitlines():
              match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
              if match:
                  versions.append(tuple(map(int, match.groups())))

          if versions:
              major, minor, patch = max(versions)
              patch += 1
              version_tag = f"v{major}.{minor}.{patch}"
          else:
              version_tag = "v1.0.0"

          print(f"tag={version_tag}")
          PY

      - name: Update references for the release
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version_tag = os.environ["VERSION_TAG"]
          reference = re.compile(
              r"(pandeyaws/[^\s@`'\"<>]+)@[^\s`'\"<>]+"
          )
          updated_files = []

          for path in sorted(Path(".github/actions").rglob("*")):
              if not path.is_file() or path.name.lower() not in {
                  "action.yml",
                  "action.yaml",
                  "readme.md",
              }:
                  continue

              content = path.read_text(encoding="utf-8")
              updated = reference.sub(rf"\g<1>@{version_tag}", content)
              if updated != content:
                  path.write_text(updated, encoding="utf-8")
                  updated_files.append(path.as_posix())

          print(f"Updated references to {version_tag} in {len(updated_files)} file(s).")
          for path in updated_files:
              print(path)
          PY

      - name: Prepare release commit
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/actions
          if ! git diff --cached --quiet; then
            git commit -m "chore: update action references to ${VERSION_TAG}"
          fi

      - name: Create and push release tags
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/${VERSION_TAG}"; then
            echo "Version tag ${VERSION_TAG} already exists." >&2
            exit 1
          fi

          release_commit="$(git rev-parse HEAD)"
          major_tag="${VERSION_TAG%%.*}"
          git tag "${VERSION_TAG}" "${release_commit}"
          git tag --force "${major_tag}" "${release_commit}"
          git push origin "refs/tags/${VERSION_TAG}"
          git push --force origin "refs/tags/${major_tag}"
